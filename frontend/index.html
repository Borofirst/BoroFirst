
<!doctype html>
<html lang="en-IN">
  <head>
    <!-- =====================================================
         DOCUMENT CONFIGURATION
    ====================================================== -->

    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#0B2578"
    />

    <meta
      name="color-scheme"
      content="light"
    />

    <meta
      name="format-detection"
      content="telephone=no"
    />

    <!-- =====================================================
         DEFAULT WEBSITE TITLE
         
         Individual React pages will override this through SEO.jsx.
    ====================================================== -->

    <title>
      Borofirst | Smart Financial Solutions & Loans
    </title>

    <!-- =====================================================
         DEFAULT DESCRIPTION
    ====================================================== -->

    <meta
      name="description"
      content="Borofirst provides smart, transparent and customer-focused financial solutions including personal loans, home loans, business loans and other lending solutions."
    />

    <meta
      name="author"
      content="Borofirst"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- =====================================================
         CANONICAL URL
         
         CHANGE THIS TO YOUR REAL PRODUCTION DOMAIN.
    ====================================================== -->

    <link
      rel="canonical"
      href="https://borofirst.com/"

         FAVICON
    ====================================================== -->

    <link
      rel="icon"
      type="image/jpeg"
      href="/logo.png"
    />



    <link
      rel="apple-touch-icon"
      href="/logo.png"
    />

  <meta
    name="application-name"
    content="Borofirst"
  />

  <meta
    name="apple-mobile-web-app-title"

    <meta
      property="og:image"
      content="https://borofirst.com/og-image.png"
    />

    <meta
      property="og:image:alt"
      content="Borofirst - Smart Financial Solutions"
    />

    <meta
      property="og:locale"

      name="twitter:description"

    <meta

    />
